services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: life_db
      POSTGRES_USER: life_app
      POSTGRES_PASSWORD: "${LIFE_DOCKER_DB_PASSWORD:?Set LIFE_DOCKER_DB_PASSWORD in .env}"
    ports:
      - "127.0.0.1:${LIFE_DOCKER_DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/life_db
      SPRING_DATASOURCE_USERNAME: life_app
      DB_PASSWORD: "${LIFE_DOCKER_DB_PASSWORD:?Set LIFE_DOCKER_DB_PASSWORD in .env}"
      LIFE_1IN8B_API_KEY: "${LIFE_1IN8B_API_KEY:-${API_KEY:-}}"
      LIFE_1IN8B_TOKEN_SECRET: "${LIFE_1IN8B_TOKEN_SECRET:-}"
    ports:
      - "127.0.0.1:${LIFE_DOCKER_HTTP_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
