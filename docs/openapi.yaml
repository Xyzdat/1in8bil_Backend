openapi: 3.1.0
info:
  title: Life Backend API
  version: 0.11.0
  description: Локальные сохранения и жизни, сгенерированные 1in8b Engine. Новые локальные жизни поддерживают сохраняемый фокус года с влиянием на вероятности и постепенными эффектами; docs/year-focus.md. Важность событий и предпросмотр выбора описаны в docs/event-presentation.md.
servers:
  - url: /
security:
  - guestCookie: []
paths:
  "/api/v1/sessions/{sessionId}/budget/income":
    get:
      operationId: "getBudgetIncomePage"
      description: "Чтение без продвижения времени, записи в БД или обращения к 1in8b. Правила и примеры — docs/budget-management.md."
      parameters: [{"$ref":"#/components/parameters/SessionId"}]
      responses:
        '200':
          description: "Версия состояния, доступность и данные раздела"
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/BudgetIncomePage"}}}
        '401': {"$ref":"#/components/responses/Unauthorized"}
        '404': {"$ref":"#/components/responses/NotFound"}
  "/api/v1/sessions/{sessionId}/budget/expenses":
    get:
      operationId: "getBudgetExpensesPage"
      description: "Чтение без продвижения времени, записи в БД или обращения к 1in8b. Правила и примеры — docs/budget-management.md."
      parameters: [{"$ref":"#/components/parameters/SessionId"}]
      responses:
        '200':
          description: "Версия состояния, доступность и данные раздела"
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/BudgetExpensesPage"}}}
        '401': {"$ref":"#/components/responses/Unauthorized"}
        '404': {"$ref":"#/components/responses/NotFound"}
  "/api/v1/sessions/{sessionId}/budget/jobs":
    get:
      operationId: "getBudgetJobsPage"
      description: "Чтение без продвижения времени, записи в БД или обращения к 1in8b. Правила и примеры — docs/budget-management.md."
      parameters: [{"$ref":"#/components/parameters/SessionId"}]
      responses:
        '200':
          description: "Версия состояния, доступность и данные раздела"
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/BudgetJobsPage"}}}
        '401': {"$ref":"#/components/responses/Unauthorized"}
        '404': {"$ref":"#/components/responses/NotFound"}
  "/api/v1/sessions/{sessionId}/budget/side-jobs":
    get:
      operationId: "getBudgetSideJobsPage"
      description: "Чтение без продвижения времени, записи в БД или обращения к 1in8b. Правила и примеры — docs/budget-management.md."
      parameters: [{"$ref":"#/components/parameters/SessionId"}]
      responses:
        '200':
          description: "Версия состояния, доступность и данные раздела"
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/BudgetSideJobsPage"}}}
        '401': {"$ref":"#/components/responses/Unauthorized"}
        '404': {"$ref":"#/components/responses/NotFound"}
  "/api/v1/sessions/{sessionId}/budget/businesses":
    get:
      operationId: "getBudgetBusinessesPage"
      description: "Чтение без продвижения времени, записи в БД или обращения к 1in8b. Правила и примеры — docs/budget-management.md."
      parameters: [{"$ref":"#/components/parameters/SessionId"}]
      responses:
        '200':
          description: "Версия состояния, доступность и данные раздела"
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/BudgetBusinessesPage"}}}
        '401': {"$ref":"#/components/responses/Unauthorized"}
        '404': {"$ref":"#/components/responses/NotFound"}
  "/api/v1/sessions/{sessionId}/budget/strategies":
    get:
      operationId: "getBudgetStrategiesPage"
      description: "Чтение без продвижения времени, записи в БД или обращения к 1in8b. Правила и примеры — docs/budget-management.md."
      parameters: [{"$ref":"#/components/parameters/SessionId"}]
      responses:
        '200':
          description: "Версия состояния, доступность и данные раздела"
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/BudgetStrategiesPage"}}}
        '401': {"$ref":"#/components/responses/Unauthorized"}
        '404': {"$ref":"#/components/responses/NotFound"}
  "/api/v1/sessions/{sessionId}/budget/assets":
    get:
      operationId: "getBudgetAssetsPage"
      description: "Чтение без продвижения времени, записи в БД или обращения к 1in8b. Правила и примеры — docs/budget-management.md."
      parameters: [{"$ref":"#/components/parameters/SessionId"}]
      responses:
        '200':
          description: "Версия состояния, доступность и данные раздела"
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/BudgetAssetsPage"}}}
        '401': {"$ref":"#/components/responses/Unauthorized"}
        '404': {"$ref":"#/components/responses/NotFound"}
  "/api/v1/sessions/{sessionId}/budget/assets/{assetId}/sale-preview":
    get:
      operationId: "getBudgetSalePreviewPage"
      description: "Чтение без продвижения времени, записи в БД или обращения к 1in8b. Правила и примеры — docs/budget-management.md."
      parameters:
        -
          $ref: "#/components/parameters/SessionId"
        -
          name: "assetId"
          in: "path"
          required: true
          schema: {"type":"string"}
      responses:
        '200':
          description: "Версия состояния, доступность и данные раздела"
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/BudgetSalePreviewPage"}}}
        '401': {"$ref":"#/components/responses/Unauthorized"}
        '404': {"$ref":"#/components/responses/NotFound"}
        '409': {"$ref":"#/components/responses/Conflict"}
  "/api/v1/sessions/{sessionId}/budget/actions":
    post:
      operationId: "manageBudget"
      description: "Все суммы и исходы определяет сервер. Для сгенерированной local с 18 лет; блокируется при COMPLETE, здоровье 0 и pendingDecision. APPLIED возвращает полную Session с увеличенной версией и budgetAction. Вероятностный DECLINED возвращает HTTP 200, прежнюю версию и записанный исход без изменения жизни. Повтор ключа/тела не повторяет действие; разные ключи не меняют исход того же отклика в том же месяце при тех же условиях. Подробнее — docs/budget-management.md."
      parameters: [{"$ref":"#/components/parameters/SessionId"},{"$ref":"#/components/parameters/IdempotencyKey"}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/BudgetActionRequest"}}}}
      responses:
        '200': {"$ref":"#/components/responses/Session"}
        '400': {"$ref":"#/components/responses/BadRequest"}
        '401': {"$ref":"#/components/responses/Unauthorized"}
        '404': {"$ref":"#/components/responses/NotFound"}
        '409': {"$ref":"#/components/responses/Conflict"}

  /api/v1/sessions/{sessionId}/focus:
    patch:
      operationId: changeYearFocus
      description: Меняет фокус новой локальной жизни в любой момент, включая паузу и ожидание решения. Не продвигает время, не начисляет бонус и не заменяет предложенный вопрос. Выбор сохраняется на следующие годы до смены; работа в 65 лет автоматически сменяется балансом. Нельзя включить фокус в старой жизни без сохранённой модели focus. Версия и ключ идемпотентности проверяются как у других действий. Повтор ключа возвращает актуальную сессию без повторного действия.
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, focusId]
              properties:
                expectedVersion: { type: integer, format: int64, minimum: 1 }
                focusId: { $ref: '#/components/schemas/FocusId' }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: Полная сессия с обновлённым simulation.yearlyFocus и новой version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '409':
          description: VERSION_CONFLICT, IDEMPOTENCY_CONFLICT, FOCUS_UNSUPPORTED (старый/внешний/демонстрационный движок), FOCUS_UNAVAILABLE (возраст), SESSION_COMPLETE. При нулевом здоровье активная локальная жизнь завершается общим правилом и возвращает 200 с COMPLETE вместо применения фокуса.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/sessions/generated/local:
    post:
      operationId: generateLocalSession
      description: Собственный движок childhood-2. Статистика предварительно импортируется в PostgreSQL. Без внешних HTTP-вызовов. Пустой объект выбирает страну взвешенно среди 36 стран SupportedCountry и год 2026. Новые жизни используют birth-context-2026-v2 и закреплённую серверную калибровку socioeconomic-1 семьи, жилищных удобств и зарплатных соотношений; прежние сохранения не переводятся на новые правила. Формат ответа сохранён. Единственный родитель отражается nullable mother/father и familyType, электричество — electricityAtHome, вода и санитария — в описании housing. Суммы зарплат остаются игровой шкалой RUB, не конверсией исходных валют ILO. Подробности в docs/socioeconomic-engine.md.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                countryIso3: { $ref: '#/components/schemas/SupportedCountry' }
                birthYear: { type: integer, minimum: 2023, maximum: 2026, default: 2026 }
      responses:
        '201':
          description: Новая локальная жизнь, возраст 0. Семья и игровые допущения в simulation.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '200': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/sessions/{sessionId}/step:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: stepLocalSimulation
      description: Продвигает локальную жизнь на два игровых месяца, до смерти. С 18 лет подключается adult-1. Шесть основных шагов на год; ответы и семейные вехи могут добавлять записи. Не более двух предложенных вопросов на год летописи, включая продолжения сюжетов; интервал между вопросами не менее четырёх месяцев. Появление вероятностное и зависит от состояния жизни, обязательного минимума нет. При здоровье 0 жизнь завершается немедленно без продвижения времени, даже при ожидающем решении. С 65 лет автоматически применяется игровая пенсия. STEP_UNSUPPORTED для старых сессий и 1in8b; DECISION_REQUIRED при ожидающем актуальном решении. Ответ на решение не продвигает время. STEP_REQUIRED при /advance для новой жизни. Выбор с оплатой может вернуть 409 SPENDING_INSUFFICIENT_FUNDS, если после появления решения деньги потрачены в магазине. Устаревшее рабочее решение пенсионера закрывается без оплаты и выполнения выбора; ответ содержит актуальную сессию.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedAction' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: HTTP-приложение отвечает
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: UP }
  /api/v1/guest:
    post:
      operationId: ensureGuest
      security: []
      description: Открывает гостевой доступ при отсутствии действующей cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, maxProperties: 0 }
      responses:
        '204':
          description: Гостевой доступ готов
          headers:
            Set-Cookie:
              description: При создании гостя устанавливает life_owner на год.
              schema: { type: string }
  /api/v1/sessions:
    get:
      operationId: listSessions
      responses:
        '200':
          description: Сохранения гостя от недавно обновлённых к более старым
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createSession
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSession' }
      responses:
        '201':
          description: Начато новое сохранение локального движка
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '200': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/sessions/generated:
    post:
      operationId: generateSession
      description: Генерирует и сохраняет новорождённого через 1in8b Engine. Новая жизнь начинается с возраста 0 и без ожидающего решения.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, maxProperties: 0 }
      responses:
        '201':
          description: Сгенерирована новая жизнь
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '200': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/EngineLimit' }
        '502': { $ref: '#/components/responses/EngineResponse' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSession
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/sessions/{sessionId}/character:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    patch:
      operationId: editCharacter
      description: Меняет указанные поля в существующем сохранении с проверкой владельца, Idempotency-Key и expectedVersion. Для local доступны имя, здоровье, счастье, интеллект, отношения, внешность и аура. Для сгенерированной локальной жизни только до первого шага (simulation.elapsedMonths=0, ACTIVE) доступны sex, birthYear, birthplace и family. После первого шага эти поля дают 409 BIRTH_CONFIGURATION_LOCKED, даже если state.age ещё равен 0. family.members заменяет весь список родственников при рождении; пропущенный members оставляет список прежним. Статистика страны обновляется из PostgreSQL. Исходный запрос создания сохраняется для безопасного повтора; новый персонаж не создаётся. Для 1in8b остаются только отображаемое имя и внешность приложения, остальные поля дают CHARACTER_FIELDS_READ_ONLY. Здоровье 0 завершает пошаговую жизнь в том же ответе.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterEdit' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/sessions/{sessionId}/finances:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSessionFinances
      description: Сводка бюджета, операции, покупки и категории вкладки. Для 1in8b возвращает доступные показатели и предложения из последнего сохранённого ответа движка.
      responses:
        '200':
          description: Финансовые данные с актуальной версией сессии
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Finances' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/sessions/{sessionId}/spending/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - name: categoryId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getSpendingCategory
      description: Возвращает данные модального окна, предложения, цены, доступность и расчёт остатка для сохранённой версии.
      responses:
        '200':
          description: Состояние окна выбора
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpendingShop' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/sessions/{sessionId}/purchases:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: buySpendingItem
      description: Выполняет локальную покупку в текущем возрасте. Сумма, последствия и допустимость проверяются сервером. Для 1in8b возвращает SPENDING_READ_ONLY.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuySpendingItem' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/sessions/{sessionId}/advance:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: advanceYear
      description: Продвигает жизнь до следующей границы года или решения и сохраняет результат. При ожидающем решении возвращает конфликт.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedAction' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/EngineLimit' }
        '502': { $ref: '#/components/responses/EngineResponse' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/sessions/{sessionId}/decisions/{decisionId}/answers:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - name: decisionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: answerDecision
      description: Применяет ответ на ожидающее решение и сохраняет результат. 1in8b Engine может одновременно продвинуть возраст.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerDecision' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/EngineLimit' }
        '502': { $ref: '#/components/responses/EngineResponse' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    guestCookie:
      type: apiKey
      in: cookie
      name: life_owner
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID одной операции. При повторе с теми же параметрами сервер возвращает актуальное сохранение.
      schema: { type: string, format: uuid }
  responses:
    Session:
      description: Актуальное сохранение
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Session' }
    BadRequest:
      description: Некорректный запрос или неизвестный вариант ответа
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Требуется действующая гостевая cookie
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Сохранение недоступно текущему гостю
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Запрос конфликтует с состоянием сохранения или с ранее использованным ключом
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    EngineLimit:
      description: Исчерпан лимит вызовов или квота 1in8b Engine
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    EngineResponse:
      description: Поставщик вернул ответ, который backend не смог обработать.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Поставщик сейчас недоступен, отсутствует ключ доступа или невозможно открыть токен жизни.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    SupportedCountry:
      type: string
      description: ISO3 страны собственного движка. Отсутствующее поле при генерации означает взвешенный случайный выбор; неизвестный код возвращает 400 INVALID_COUNTRY.
      enum: [ARG, AUS, BGD, BRA, CAN, CHL, CHN, COD, COL, EGY, ETH, GHA, IDN, IND, IRN, JPN, KAZ, KEN, KOR, MAR, MEX, MYS, NGA, NZL, PAK, PER, PHL, RUS, SAU, THA, TZA, UGA, USA, UZB, VNM, ZAF]
    LocalSimulation:
      type: object
      required: [engineVersion, statisticsRelease, statisticsYear, elapsedMonths, monthOfYear, stepMonths, family, skills, assumptions]
      properties:
        yearlyFocus:
          description: Фокус новых локальных жизней. null/отсутствие в старых сохранениях означает прежние правила без автоматического перевода. Состояние и каталог возвращаются вместе с Session, дополнительные частые запросы не нужны.
          anyOf:
            - { $ref: '#/components/schemas/YearFocus' }
            - { type: 'null' }
        engineVersion: { type: string, example: childhood-2 }
        adult:
          description: Взрослое состояние. null до первого взрослого шага; старое сохранение инициализируется при следующем действии без выдуманной прошлой карьеры. engineVersion остаётся childhood-2 для совместимости; версия взрослой модели хранится здесь.
          anyOf:
            - { $ref: '#/components/schemas/AdultLife' }
            - { type: 'null' }
        statisticsRelease: { type: string, example: birth-context-2026-v2 }
        statisticsYear: { type: integer, example: 2026 }
        death:
          description: При смерти state.status=COMPLETE; прекратить таймер и любые действия. Конкретная игровая причина в causeDetails; в старых сохранениях она может отсутствовать.
          anyOf:
            - { $ref: '#/components/schemas/Death' }
            - { type: 'null' }
        elapsedMonths: { type: integer, minimum: 0 }
        monthOfYear: { type: integer, minimum: 0, maximum: 11 }
        stepMonths: { type: integer, const: 2 }
        assumptions:
          type: array
          description: Явные ограничения источников и игровые допущения. Это сведения о модели, не события жизни.
          items: { type: string }
        skills:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 100 }
        family:
          type: array
          items:
            type: object
            required: [id, role, name, age, alive, closeness, trust]
            properties:
              id: { type: string, description: Устойчивый идентификатор внутри сохранения }
              role: { type: string }
              name: { type: string }
              age: { type: integer, minimum: 0 }
              alive: { type: boolean }
              closeness: { type: integer, minimum: 0, maximum: 100 }
              trust: { type: integer, minimum: 0, maximum: 100 }
              sex: { type: [string, 'null'], enum: [MALE, FEMALE, null] }
              occupation: { type: [string, 'null'], description: Известная профессия родственника. Новые родители birth-economy-2 получают конкретное занятие с пометкой «игровая специализация»; это не статистика узкой профессии. Старые занятия сохраняются. Дополнительные текущие данные взрослой модели в adult.npcs по тому же id. }
              death:
                description: Смерть близкого. age — возраст этого человека; elapsedMonths — время от рождения героя. null у живых и в старых сохранениях без подробностей.
                anyOf:
                  - { $ref: '#/components/schemas/Death' }
                  - { type: 'null' }
              contact:
                description: Связь с героем, независимо от родства, романтического статуса и близости. null до включения взрослой модели/наблюдения и для умерших; null не означает прекращение связи.
                anyOf:
                  - { $ref: '#/components/schemas/ContactState' }
                  - { type: 'null' }
    ContactState:
      type: object
      required: [status, trackedSinceMonth, lastContactMonth, statusSinceMonth, reason]
      properties:
        status:
          type: string
          enum: [IN_TOUCH, RARE_CONTACT, NO_CONTACT]
          description: Общаемся / Редко общаемся / Связь прервана. Вычисляет backend; низкая близость и развод сами по себе не определяют это поле.
        trackedSinceMonth:
          type: integer
          minimum: 0
          description: Игровой месяц начала наблюдения. Для старого сохранения — месяц первого действия после обновления, без восстановления неизвестного прошлого.
        lastContactMonth:
          type: [integer, 'null']
          minimum: 0
          description: Последний учтённый контакт в игровых месяцах с рождения героя; null если дата неизвестна. Не дата UTC.
        statusSinceMonth: { type: integer, minimum: 0 }
        reason:
          type: string
          enum: [INITIALIZED, INTERACTION, HOUSEHOLD, TIME_APART, PLAYER_CHOICE, RECONNECTED]
          description: INITIALIZED — начальное игровое предположение; HOUSEHOLD — поддерживаемое общение в семье/текущей паре; PLAYER_CHOICE — явное прекращение; RECONNECTED — успешное возобновление.
    AdultMoney:
      type: number
      description: Игровые рубли RUB с двумя десятичными знаками. Не PPP и не национальные зарплаты из статистики.
    AdultTraits:
      type: object
      required: [diligence, sociability, openness, resilience]
      properties:
        diligence: { type: integer, minimum: 0, maximum: 100 }
        sociability: { type: integer, minimum: 0, maximum: 100 }
        openness: { type: integer, minimum: 0, maximum: 100 }
        resilience: { type: integer, minimum: 0, maximum: 100 }
    AdultLife:
      type: object
      required: [modelVersion, ageStage, currency, traits, education, career, partnership, npcs, healthConditions, debts, assets, stories, memories, housing, assumptions]
      properties:
        modelVersion: { type: string, const: adult-1 }
        ageStage: { type: string, enum: [EARLY_ADULT, MIDDLE_ADULT, LATE_CAREER, LATER_LIFE], description: Мягкие этапы 18–29 / 30–49 / 50–64 / 65+. Не запреты на учёбу или отношения. }
        currency: { type: string, const: RUB }
        traits: { $ref: '#/components/schemas/AdultTraits' }
        education:
          type: object
          required: [level, field, startedMonth, completesMonth, status]
          properties:
            level: { type: string }
            field: { type: [string, 'null'] }
            startedMonth: { type: [integer, 'null'] }
            completesMonth: { type: [integer, 'null'] }
            status: { type: string }
        career: { $ref: '#/components/schemas/AdultCareer' }
        partnership:
          anyOf:
            - { $ref: '#/components/schemas/AdultPartnership' }
            - { type: 'null' }
        npcs:
          type: object
          description: Ключ совпадает с simulation.family[].id. Персонажа игрока в этой карте нет; parentIds/partnerId могут ссылаться на character. Отсутствие партнёра и детей допустимо.
          additionalProperties: { $ref: '#/components/schemas/AdultNpc' }
        healthConditions:
          type: array
          items: { $ref: '#/components/schemas/AdultCondition' }
        debts:
          type: array
          items: { $ref: '#/components/schemas/AdultDebt' }
        assets:
          type: array
          items: { $ref: '#/components/schemas/AdultAsset' }
        stories:
          type: array
          description: Известные сюжеты, без будущих исходов и скрытой очереди.
          items:
            type: object
            required: [id, template, stage, status, beganMonth, endedMonth, participants]
            properties:
              id: { type: string }
              template: { type: string }
              stage: { type: string }
              status: { type: string, enum: [ACTIVE, COMPLETED, CANCELLED] }
              beganMonth: { type: integer }
              endedMonth: { type: [integer, 'null'] }
              participants: { type: array, items: { type: string } }
        memories:
          type: array
          items:
            type: object
            required: [id, month, kind, personId, text]
            properties:
              id: { type: string }
              month: { type: integer }
              kind: { type: string }
              personId: { type: [string, 'null'] }
              text: { type: string }
        housing: { type: string }
        assumptions: { type: array, items: { type: string } }
    AdultCareer:
      type: object
      description: В собственном движке в 65 лет включается RETIRED, зарплата прекращается, начинается игровая пенсия; обычный найм и новый бизнес после пенсии недоступны. Возраст и размер пенсии — игровые допущения, одинаковые для всех стран. История старых сохранений не переписывается; исправление применяется при следующем шаге или ответе.
      required: [status, occupation, industry, employer, position, monthlyPay, beganMonth, experienceMonths, qualification, satisfaction, stability, risk, monthlyPension, history]
      properties:
        status: { type: string, enum: [UNEMPLOYED, PROBATION, EMPLOYED, BUSINESS, RETIRED] }
        occupation: { type: [string, 'null'] }
        industry: { type: [string, 'null'] }
        employer: { type: [string, 'null'] }
        position: { type: [string, 'null'] }
        monthlyPay: { $ref: '#/components/schemas/AdultMoney', description: Базовая месячная оплата до поправки на работоспособность. Начисления смотреть в finances.ledger. }
        beganMonth: { type: integer }
        experienceMonths: { type: integer, minimum: 0 }
        qualification: { type: integer, minimum: 0 }
        satisfaction: { type: integer, minimum: 0, maximum: 100 }
        stability: { type: integer, minimum: 0, maximum: 100 }
        risk: { type: integer, minimum: 0, maximum: 100 }
        monthlyPension: { $ref: '#/components/schemas/AdultMoney' }
        history:
          type: array
          items:
            type: object
            required: [id, occupation, employer, beganMonth, endedMonth, endReason]
            properties:
              id: { type: string }
              occupation: { type: string }
              employer: { type: string }
              beganMonth: { type: integer }
              endedMonth: { type: [integer, 'null'] }
              endReason: { type: [string, 'null'] }
    AdultPartnership:
      type: object
      required: [partnerId, status, beganMonth, cohabiting, satisfaction, conflict, milestones]
      properties:
        partnerId: { type: string }
        status: { type: string, enum: [DATING, COHABITING, MARRIED, SEPARATED, DIVORCED, WIDOWED] }
        beganMonth: { type: integer }
        cohabiting: { type: boolean }
        satisfaction: { type: integer, minimum: 0, maximum: 100 }
        conflict: { type: integer, minimum: 0, maximum: 100 }
        milestones: { type: array, items: { type: string } }
    AdultNpc:
      type: object
      required: [id, traits, education, occupation, monthlyIncome, health, maritalStatus, partnerId, countryIso2, parentIds]
      properties:
        id: { type: string }
        traits: { $ref: '#/components/schemas/AdultTraits' }
        education: { type: string }
        occupation: { type: [string, 'null'] }
        monthlyIncome: { $ref: '#/components/schemas/AdultMoney' }
        health: { type: integer, minimum: 0, maximum: 100 }
        maritalStatus: { type: string }
        partnerId: { type: [string, 'null'] }
        countryIso2: { type: string }
        parentIds: { type: array, items: { type: string }, description: Устойчивые родительские связи; character означает персонажа игрока. }
    AdultCondition:
      type: object
      required: [id, kind, onsetMonth, severity, stage, treatment, reviewMonth, endedMonth, chronic, workCapacity]
      properties:
        id: { type: string }
        kind: { type: string, enum: [INJURY, HEALTH_CONDITION] }
        onsetMonth: { type: integer }
        severity: { type: integer, minimum: 0, maximum: 100 }
        stage: { type: string, enum: [ACTIVE, CHRONIC, RECOVERED] }
        treatment: { type: string, enum: [REST, SUPERVISED] }
        reviewMonth: { type: integer }
        endedMonth: { type: [integer, 'null'] }
        chronic: { type: boolean }
        workCapacity: { type: integer, minimum: 0, maximum: 100 }
    AdultDebt:
      type: object
      required: [id, kind, principal, annualBasisPoints, monthlyPayment, missedPayments]
      properties:
        id: { type: string }
        kind: { type: string, enum: [PERSONAL, MORTGAGE] }
        principal: { $ref: '#/components/schemas/AdultMoney' }
        annualBasisPoints: { type: integer, description: Игровая годовая ставка; 100 базисных пунктов = 1%. }
        monthlyPayment: { $ref: '#/components/schemas/AdultMoney', description: Плановое погашение основной суммы; проценты учитываются отдельно. }
        missedPayments: { type: integer, minimum: 0 }
    AdultAsset:
      type: object
      required: [id, kind, title, value, ownershipPercent, purchaseId]
      properties:
        id: { type: string }
        kind: { type: string, enum: [PROPERTY, INVESTMENT] }
        title: { type: string }
        value: { $ref: '#/components/schemas/AdultMoney' }
        ownershipPercent: { type: integer, minimum: 0, maximum: 100 }
        purchaseId: { type: [string, 'null'] }
    Death:
      type: object
      required: [elapsedMonths, age, cause, model, note]
      properties:
        elapsedMonths: { type: integer, minimum: 0 }
        age: { type: integer, minimum: 0 }
        cause:
          type: string
          const: UNSPECIFIED
          deprecated: true
          description: Прежний маркер общей смертности, сохранён для совместимости строгих декодеров. Конкретную причину читать из causeDetails, не из этого поля.
        model: { type: string, const: UN_WPP_2024_QX, description: Сохранённый идентификатор модели для совместимости. При здоровье 0 срабатывает терминальное игровое правило без броска ООН; это указано в note. }
        note: { type: string }
        causeDetails:
          description: Игровая атрибуция после смерти по общей смертности или достижения здоровья 0. При нуле учитывается наиболее тяжёлый активный эпизод; без известного эпизода label содержит «Критическое ухудшение здоровья», code остаётся ACUTE_DISEASE_COMPLICATIONS, conditionId равен null. Не является диагнозом или статистикой причин по стране. optional/nullable для старых жизней; не пересчитывается при GET или повторе запроса.
          anyOf:
            - { $ref: '#/components/schemas/DeathCauseDetails' }
            - { type: 'null' }
    DeathCauseDetails:
      type: object
      required: [code, label, model, basis, conditionId]
      properties:
        code:
          type: string
          enum: [PERINATAL_COMPLICATIONS, CONGENITAL_CONDITION, RESPIRATORY_INFECTION, SEVERE_INFECTION, ACCIDENT, HEART_ATTACK, STROKE, CANCER, ACUTE_DISEASE_COMPLICATIONS, CHRONIC_DISEASE_COMPLICATIONS, INJURY_COMPLICATIONS]
        label: { type: string, example: Инфаркт миокарда }
        model: { type: string, const: death-causes-1 }
        basis: { type: string, const: GAME_ASSUMPTION }
        conditionId:
          type: [string, 'null']
          description: ID существующего активного эпизода adult.diseases, если причиной выбраны его осложнения. null для прочих причин и близких без медицинской истории. Не означает новый диагноз у существующего эпизода.
    BirthMeasure:
      type: object
      required: [value, unit, year, source, basis, note]
      properties:
        value: { type: number }
        unit: { type: string, enum: [probability, USD_CURRENT, years] }
        year: { type: integer }
        source: { type: string }
        basis: { type: string, enum: [STATISTIC, PROJECTION, GAME_SELECTION] }
        note: { type: string }
    BirthDescription:
      type: object
      required: [value, basis, source, note]
      properties:
        value: { type: [string, 'null'] }
        basis: { type: string, enum: [GAME_ASSUMPTION, SAMPLED_PROXY] }
        source: { type: string }
        note: { type: string }
    BirthFacts:
      type: object
      description: Снимок рождения собственного движка. Источники, годы, единицы и игровые допущения обязательны для корректного отображения. ВВП не является доходом семьи; валюта страны не меняет валюту кошелька.
      required: [countryIso3, sex, worldBirthProbability, selectionProbability, gdpPerCapita, lifeExpectancy, underFiveMortality, currency, countryReligions, countryLanguages, wealth, housing, familyRelationships, familyFaith, familyLanguage, sources]
      properties:
        countryIso3: { $ref: '#/components/schemas/SupportedCountry' }
        sex: { type: string, enum: [MALE, FEMALE] }
        worldBirthProbability: { $ref: '#/components/schemas/BirthMeasure' }
        selectionProbability: { $ref: '#/components/schemas/BirthMeasure' }
        gdpPerCapita: { $ref: '#/components/schemas/BirthMeasure' }
        lifeExpectancy: { $ref: '#/components/schemas/BirthMeasure' }
        underFiveMortality: { $ref: '#/components/schemas/BirthMeasure' }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Код валюты страны ISO 4217, не баланс и не конверсия. Игровой кошелёк использует finances.currency. }
        wealth: { $ref: '#/components/schemas/BirthDescription', description: Для новых локальных жизней — группа достатка и относительный индекс дохода/потребления по WDI. Не денежный баланс и не вероятность рождения в группе. При отсутствии статистики — явная игровая оценка. }
        housing: { $ref: '#/components/schemas/BirthDescription' }
        familyRelationships: { $ref: '#/components/schemas/BirthDescription' }
        familyFaith: { $ref: '#/components/schemas/BirthDescription' }
        familyLanguage: { $ref: '#/components/schemas/BirthDescription' }
        countryReligions:
          type: array
          description: Pew, оценки населения 2020. Семь взаимоисключающих групп; погрешность округления возможна.
          items:
            type: object
            required: [code, percent]
            properties:
              code: { type: string }
              percent: { type: number, minimum: 0, maximum: 100 }
        countryLanguages:
          type: array
          description: CLDR 48, доли владения языками (включая вторые); могут пересекаться и не обязаны суммироваться до 100%.
          items:
            type: object
            required: [code, percent, status]
            properties:
              code: { type: string }
              percent: { type: number, minimum: 0, maximum: 100 }
              status: { type: [string, 'null'] }
        sources:
          type: object
          additionalProperties: { type: string, format: uri }
    SpendingCurrency:
      type: string
      enum: [RUB, PPP_USD]
      description: Игровые рубли локальной жизни или международные доллары по ППС для 1in8b. Все суммы в основных единицах указанной валюты.
    FinanceVersion:
      type: object
      required: [version, age, currency]
      properties:
        version: { type: integer, format: int64, minimum: 1 }
        age: { type: integer, minimum: 0 }
        currency: { $ref: '#/components/schemas/SpendingCurrency' }
    Finances:
      allOf:
        - { $ref: '#/components/schemas/FinanceVersion' }
        - type: object
          required: [summary, ledger, purchases, categories, location]
          properties:
            summary: { $ref: '#/components/schemas/FinanceSummary' }
            ledger:
              type: [array, 'null']
              description: Новые операции идут первыми. null означает, что детализация недоступна.
              items: { $ref: '#/components/schemas/FinanceTransaction' }
            purchases:
              type: [array, 'null']
              description: Новые приобретения идут первыми. null означает, что детализация недоступна.
              items: { $ref: '#/components/schemas/PurchasedItem' }
            categories:
              type: array
              items: { $ref: '#/components/schemas/SpendingCategory' }
            location:
              anyOf:
                - { $ref: '#/components/schemas/SpendingLocation' }
                - { type: 'null' }
    FinanceSummary:
      type: object
      required: [income, expenses, periodMonths, savings, debt, availableBalance, netWorth, occupation, depositRateBasisPoints, asOfAge]
      properties:
        income: { type: [number, 'null'] }
        expenses: { type: [number, 'null'] }
        periodMonths:
          type: [integer, 'null']
          description: Для local доходы и расходы за последние 12 игровых месяцев. null означает, что период поставщика не указан.
        savings: { type: [number, 'null'] }
        debt: { type: [number, 'null'] }
        availableBalance: { type: [number, 'null'] }
        netWorth:
          type: [number, 'null']
          description: Чистая стоимость имущества из 1in8b. Хранится отдельно от доступного остатка.
        occupation: { type: [string, 'null'] }
        depositRateBasisPoints:
          type: [integer, 'null']
          description: 100 базисных пунктов соответствуют 1% годовых в локальном игровом бюджете.
        asOfAge:
          type: [integer, 'null']
          description: Возраст, к которому относится сводка. Снимок 1in8b может быть старше текущего состояния.
    FinanceTransaction:
      type: object
      required: [id, month, kind, title, income, expense]
      properties:
        id: { type: string }
        sourceId: { type: [string, 'null'], description: Устойчивый источник операции; LEGACY_EARNINGS и LEGACY_UNCLASSIFIED обозначают неполную детализацию старого сохранения. }
        categoryId: { type: [string, 'null'], description: Устойчивая категория затрат; назначение не определяется по title. }
        relatedId: { type: [string, 'null'], description: ID занятости, покупки, актива или обязательства, если связь известна. }
        month:
          type: integer
          minimum: 0
          description: Игровой месяц с рождения. Для отображения возраста делите на 12.
        kind: { type: string, enum: [BUDGET, PURCHASE, UPKEEP, INTEREST] }
        flow: { type: [string, 'null'], enum: [OPERATING, FINANCING, null], description: FINANCING означает перемещение капитала или основной суммы займа. Такие суммы не входят в summary.income/expenses. Для итогов использовать summary; null соответствует старым операциям. }
        title: { type: string }
        income: { type: number, minimum: 0 }
        expense: { type: number, minimum: 0 }
    PurchasedItem:
      type: object
      required: [id, month, categoryId, itemId, title, icon, price, yearlyCost, durationMonths, petName, status, location]
      properties:
        id: { type: string, format: uuid }
        month: { type: integer, minimum: 0 }
        categoryId: { type: string }
        itemId: { type: string }
        title: { type: string }
        icon: { type: [string, 'null'] }
        price: { type: number, minimum: 0 }
        yearlyCost: { type: [number, 'null'], minimum: 0 }
        durationMonths: { type: [integer, 'null'], minimum: 1 }
        petName: { type: [string, 'null'] }
        status: { type: string, enum: [PURCHASED, IN_PROGRESS, COMPLETED, SOLD] }
        location:
          anyOf:
            - { $ref: '#/components/schemas/SpendingLocation' }
            - { type: 'null' }
    SpendingCategory:
      type: object
      required: [id, groupId, groupTitle, title, actionTitle, description, icon, minAge, priceFrom, actions]
      properties:
        id:
          type: string
          enum: [relationships, property, health, hobby, appearance, pets, education, city, country, provider]
        groupId:
          type: string
          description: city и country имеют общий groupId moving.
        groupTitle: { type: string }
        title: { type: string }
        actionTitle: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        icon: { type: [string, 'null'] }
        minAge: { type: [integer, 'null'], minimum: 0 }
        priceFrom: { type: [number, 'null'], minimum: 0 }
        actions:
          type: array
          description: Предложения, отображаемые прямо на вкладке. Заполнено для отношений.
          items: { $ref: '#/components/schemas/SpendingOffer' }
    SpendingShop:
      allOf:
        - { $ref: '#/components/schemas/FinanceVersion' }
        - type: object
          required: [category, heading, description, confirmLabel, availableBalance, stats, suggestedPetNames, offers]
          properties:
            category: { $ref: '#/components/schemas/SpendingCategory' }
            heading: { type: string }
            description: { type: string }
            confirmLabel: { type: [string, 'null'] }
            availableBalance: { type: [number, 'null'] }
            stats: { $ref: '#/components/schemas/Stats' }
            suggestedPetNames:
              type: array
              items: { type: string }
            offers:
              type: array
              items: { $ref: '#/components/schemas/SpendingOffer' }
    SpendingOffer:
      type: object
      required: [id, title, description, icon, price, yearlyCost, durationMonths, minAge, effects, location, purchasable, unavailableReason, balanceAfterPurchase]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: [string, 'null'] }
        icon: { type: [string, 'null'] }
        price: { type: number, minimum: 0 }
        yearlyCost: { type: [number, 'null'], minimum: 0 }
        durationMonths: { type: [integer, 'null'], minimum: 1 }
        minAge: { type: [integer, 'null'], minimum: 0 }
        effects:
          type: [object, 'null']
          description: Изменения характеристик при покупке. Эффект завершения обучения применяется после курса.
          properties:
            health: { type: [integer, 'null'] }
            happiness: { type: [integer, 'null'] }
            intelligence: { type: [integer, 'null'] }
            relationships: { type: [integer, 'null'] }
            appearance: { type: [integer, 'null'] }
        location:
          anyOf:
            - { $ref: '#/components/schemas/SpendingLocation' }
            - { type: 'null' }
        purchasable: { type: boolean }
        unavailableReason: { type: [string, 'null'] }
        balanceAfterPurchase:
          type: [number, 'null']
          minimum: 0
          description: Остаток после вычитания цены. null при недоступном балансе или нехватке средств. Допустимость покупки проверяйте отдельно по purchasable.
    SpendingLocation:
      type: object
      required: [countryCode, country, city]
      properties:
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        country: { type: string }
        city: { type: [string, 'null'] }
    BuySpendingItem:
      type: object
      additionalProperties: false
      required: [expectedVersion, categoryId, itemId]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        categoryId: { type: string, minLength: 1, maxLength: 40 }
        itemId: { type: string, minLength: 1, maxLength: 80 }
        petName:
          type: [string, 'null']
          maxLength: 40
          description: Непустая кличка обязательна для pets. В остальных категориях поле пропускается или передаётся null.
    CreateSession:
      type: object
      required: [character, startingStats]
      properties:
        character: { $ref: '#/components/schemas/Character' }
        startingStats: { $ref: '#/components/schemas/StartingStats' }
    Character:
      type: object
      required: [name, gender, birthYear, birthplace]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: Полная сохранённая строка имени; не обрезать по пробелу. Новые локальные жизни используют country-names-1 с фамилиями или соответствующими семейными компонентами для 36 стран. Порядок частей зависит от страны. Старые и пользовательские имена сохраняются без изменений; правила в docs/country-names.md. }
        gender: { type: string, minLength: 1, maxLength: 50 }
        birthYear: { type: integer, minimum: 1, maximum: 9999 }
        birthplace:
          type: object
          required: [countryCode, country]
          properties:
            countryCode: { type: string, pattern: '^[A-Z]{2}$' }
            country: { type: string, minLength: 1, maxLength: 100 }
            region: { type: [string, 'null'], maxLength: 100 }
            city: { type: [string, 'null'], maxLength: 100 }
        background:
          anyOf:
            - { $ref: '#/components/schemas/Background' }
            - { type: 'null' }
    SessionCharacter:
      allOf:
        - { $ref: '#/components/schemas/Character' }
        - type: object
          properties:
            birthDetails:
              description: Снимок при рождении из 1in8b или собственного движка. Игровые допущения local раскрываются в birthFacts. У старых сохранений и ручных анкет поле может быть null.
              anyOf:
                - { $ref: '#/components/schemas/BirthDetails' }
                - { type: 'null' }
            birthFacts:
              description: Дополнительные сведения local. У 1in8b, ручных анкет и ещё не продолженных старых local поле может быть null.
              anyOf:
                - { $ref: '#/components/schemas/BirthFacts' }
                - { type: 'null' }
    BirthDetails:
      type: object
      description: Значения на момент рождения. Отдельные поля могут быть null, когда поставщик их не вернул.
      properties:
        placeType:
          type: [string, 'null']
          enum: [URBAN, RURAL, null]
          description: Городская или сельская местность. Название города хранится в character.birthplace.city.
        familyType:
          type: [string, 'null']
          enum: [MOTHER_AND_FATHER, TWO_MOTHERS, TWO_FATHERS, null]
        olderSiblingCount: { $ref: '#/components/schemas/OptionalCount' }
        familyIncomeQuintile:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
          description: Доходная группа семьи в стране, от самой низкой (1) до самой высокой (5).
        fatherPresent: { type: [boolean, 'null'] }
        mother:
          anyOf:
            - { $ref: '#/components/schemas/ParentAtBirth' }
            - { type: 'null' }
        father:
          anyOf:
            - { $ref: '#/components/schemas/ParentAtBirth' }
            - { type: 'null' }
        siblings:
          type: [array, 'null']
          items:
            type: object
            properties:
              age: { $ref: '#/components/schemas/OptionalCount' }
              sex: { type: [string, 'null'], enum: [FEMALE, MALE, null] }
              older: { type: [boolean, 'null'] }
              livesWithChild: { type: [boolean, 'null'] }
        household:
          type: [object, 'null']
          properties:
            size: { $ref: '#/components/schemas/OptionalCount' }
            mother: { type: [boolean, 'null'] }
            father: { type: [boolean, 'null'] }
            stepfather: { type: [boolean, 'null'] }
            partner: { type: [boolean, 'null'] }
            otherSpouse: { type: [boolean, 'null'] }
            siblings: { $ref: '#/components/schemas/OptionalCount' }
            children: { $ref: '#/components/schemas/OptionalCount' }
            stepchildren: { $ref: '#/components/schemas/OptionalCount' }
        homeOwned:
          type: [boolean, 'null']
          description: Признак собственного жилья. Значение false не определяет тип пользования жильём.
        electricityAtHome: { type: [boolean, 'null'] }
        faithCode:
          type: [string, 'null']
          description: Код вероисповедания. Готовая подпись доступна в character.background.religion.
        group:
          anyOf:
            - { $ref: '#/components/schemas/BirthCategory' }
            - { type: 'null' }
        caste:
          anyOf:
            - { $ref: '#/components/schemas/BirthCategory' }
            - { type: 'null' }
        disabilityCodes:
          type: [array, 'null']
          items: { type: string }
    ParentAtBirth:
      type: object
      properties:
        age: { $ref: '#/components/schemas/OptionalCount' }
        occupation:
          type: [object, 'null']
          required: [code, label]
          properties:
            code: { type: string }
            label:
              type: [string, 'null']
              description: Название по-русски. Для новых локальных рождений — конкретное занятие с пометкой «игровая специализация»; code остаётся статистической группой ISCO. Для Китая birth-economy-2 использует ILOEST до 2025 года; группа 96 означает объединение групп 6 и 9. Подробности в docs/parent-occupations.md. Старые жизни и 1in8b не пересчитываются.
        alive: { type: [boolean, 'null'] }
        livesWithChild: { type: [boolean, 'null'] }
    BirthCategory:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: [string, 'null'] }
    OptionalCount:
      type: [integer, 'null']
      minimum: 0
    Background:
      type: object
      properties:
        family: { $ref: '#/components/schemas/OptionalLabel' }
        siblings: { $ref: '#/components/schemas/OptionalLabel' }
        pets: { $ref: '#/components/schemas/OptionalLabel' }
        housing: { $ref: '#/components/schemas/OptionalLabel' }
        relationships: { $ref: '#/components/schemas/OptionalLabel' }
        father: { $ref: '#/components/schemas/OptionalLabel' }
        mother: { $ref: '#/components/schemas/OptionalLabel' }
        wealth: { $ref: '#/components/schemas/OptionalLabel' }
        religion: { $ref: '#/components/schemas/OptionalLabel' }
        language: { $ref: '#/components/schemas/OptionalLabel' }
    OptionalLabel:
      type: [string, 'null']
      maxLength: 120
    Score:
      type: integer
      minimum: 0
      maximum: 100
    StartingStats:
      type: object
      required: [health, intelligence, appearance]
      properties:
        health: { $ref: '#/components/schemas/Score' }
        intelligence: { $ref: '#/components/schemas/Score' }
        appearance: { $ref: '#/components/schemas/Score' }
    FocusId:
      type: string
      enum: [balanced, learning, friends, home, health, creativity, rest, work]
    FocusDeltaMap:
      type: object
      description: Только ненулевые изменения. Названия характеристик соответствуют state.stats, навыков — simulation.skills, близости — ID людей из simulation.family.
      additionalProperties: { type: integer }
    FocusEffects:
      type: object
      required: [periodMonths, stats, skills, closeness]
      properties:
        periodMonths: { type: integer, const: 12 }
        stats: { $ref: '#/components/schemas/FocusDeltaMap' }
        skills: { $ref: '#/components/schemas/FocusDeltaMap' }
        closeness: { $ref: '#/components/schemas/FocusDeltaMap' }
      description: Игровые темпы за 12 месяцев. Начисляются пропорционально прожитому времени с сохранением дробных остатков, только при шагах. Не обещание итогового роста — события меняют состояние отдельно, шкалы ограничены, смерть/разрыв связи прекращают соответствующее влияние. Не прибавлять на frontend.
    FocusOption:
      type: object
      required: [id, title, description, available, reason, effects, matchingEventWeightMultiplier]
      properties:
        id: { $ref: '#/components/schemas/FocusId' }
        title: { type: string }
        description: { type: string }
        available: { type: boolean }
        reason: { type: [string, 'null'] }
        effects: { $ref: '#/components/schemas/FocusEffects' }
        matchingEventWeightMultiplier:
          type: integer
          enum: [1, 3]
          description: Множитель веса подходящих доступных событий, не множитель итоговой вероятности. Существующие очереди/сюжеты и ограничения сохраняются. Вес остальных событий остаётся ненулевым.
    FocusApplied:
      type: object
      required: [focusId, month, stats, skills, closeness]
      properties:
        focusId: { $ref: '#/components/schemas/FocusId' }
        month: { type: integer, minimum: 0 }
        stats: { $ref: '#/components/schemas/FocusDeltaMap' }
        skills: { $ref: '#/components/schemas/FocusDeltaMap' }
        closeness: { $ref: '#/components/schemas/FocusDeltaMap' }
      description: Только фактически применённая часть фокуса за последний обработанный интервал; карты могут быть пустыми из-за округления или пределов шкал. При смене фокуса последняя запись может относиться к прежнему focusId. Это не общий результат шага и не новые начисления на frontend.
    YearFocus:
      type: object
      required: [modelVersion, year, selectedId, changedMonth, canChange, context, options, lastApplied]
      properties:
        modelVersion: { type: string, const: year-focus-1 }
        year: { type: integer, minimum: 0, description: Текущий возрастной год, как state.age; не календарный год. }
        selectedId: { $ref: '#/components/schemas/FocusId' }
        changedMonth: { type: integer, minimum: 0 }
        canChange: { type: boolean }
        context: { type: string, description: Краткий контекст возраста/текущей учёбы/работы. Школьный возраст 6–17 — игровое обобщение, не национальная система образования или подтверждённый номер класса. }
        options:
          type: array
          items: { $ref: '#/components/schemas/FocusOption' }
        lastApplied:
          anyOf:
            - { $ref: '#/components/schemas/FocusApplied' }
            - { type: 'null' }
      description: По умолчанию balanced. Осознанные направления доступны с 3 лет, work — с 18 до 64. Смена возможна при pendingDecision. Выбор сохраняется через дни рождения; при недоступности направления по возрасту сбрасывается на balanced. У старых жизней поле null, PATCH даёт FOCUS_UNSUPPORTED.
    Stats:
      type: object
      required: [health, happiness, intelligence, relationships, appearance, aura]
      properties:
        health: { $ref: '#/components/schemas/Score' }
        happiness: { $ref: '#/components/schemas/Score' }
        intelligence: { $ref: '#/components/schemas/Score' }
        relationships: { $ref: '#/components/schemas/Score' }
        appearance:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Для 1in8b равно null, пока игрок не задаст внешность в приложении.
        aura:
          type: [integer, 'null']
          minimum: -100
          maximum: 100
          description: Отсутствует у жизни, созданной 1in8b Engine.
    Provider:
      type: string
      enum: [local, 1in8b]
    Decision:
      type: object
      required: [id, title, options]
      properties:
        id: { type: string }
        title: { type: string }
        options:
          type: array
          items: { $ref: '#/components/schemas/DecisionOption' }
    DecisionOption:
      type: object
      required: [id, label]
      properties:
        id: { type: string, maxLength: 80 }
        label: { type: string }
        effects:
          description: Непосредственные изменения для текущей версии сессии после ограничений шкал. Только предпросмотр; не прибавлять на frontend. null/отсутствие — неизвестно или выбор уже недоступен; для 1in8b всегда null. Пустые карты означают отсутствие непосредственных изменений этих показателей, но не отсутствие будущих последствий. После покупки/редактирования использовать новый ответ сервера.
          anyOf:
            - { $ref: '#/components/schemas/OptionEffects' }
            - { type: 'null' }
    OptionEffects:
      type: object
      required: [scope, stats, closeness]
      properties:
        scope: { type: string, enum: [IMMEDIATE], description: Только результат ответа сейчас. Не включает последующие шаги и скрытые исходы сюжетов. }
        stats:
          type: object
          description: Только ненулевые разности новых и текущих значений. Отсутствующее неизвестное nullable значение нельзя считать нулём.
          additionalProperties: false
          properties:
            health: { type: integer, minimum: -100, maximum: 100 }
            happiness: { type: integer, minimum: -100, maximum: 100 }
            intelligence: { type: integer, minimum: -100, maximum: 100 }
            relationships: { type: integer, minimum: -100, maximum: 100 }
            appearance: { type: integer, minimum: -100, maximum: 100 }
            aura: { type: integer, minimum: -200, maximum: 200 }
        closeness:
          type: object
          description: Только ненулевые изменения близости с уже существующими людьми. Ключ — simulation.family[].id; общий показатель relationships передаётся отдельно в stats.
          additionalProperties: { type: integer, minimum: -100, maximum: 100 }
    HistoryEvent:
      type: object
      required: [id, age, title, text]
      properties:
        id: { type: string }
        age: { type: integer, minimum: 0 }
        title: { type: string }
        text: { type: string }
        importance:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Текущая игровая значимость. У связанных событий берётся оценка всей истории из highlights, включая не вошедшие в слайд-шоу; может меняться при последствиях. У остальных — базовое правило event-importance-1. Не моральная оценка и не вероятность. null/отсутствие — оценка неизвестна (1in8b и старый демонстрационный провайдер без simulation).
        importanceSource: { type: [string, 'null'], enum: [LIFE_STORY, EVENT_RULE, null], description: LIFE_STORY — сохранённая пересматриваемая оценка сюжета; EVENT_RULE — базовое правило события. Финальность оценок сюжетов определяется highlights.status. }
        link:
          description: Явная связь с выбором/сюжетом. null для старых и несвязанных событий; близость тем или времени не означает причинную связь.
          anyOf:
            - { $ref: '#/components/schemas/EventLink' }
            - { type: 'null' }
        consequences:
          description: Уже применённые изменения. Использовать для подписей в летописи; не прибавлять повторно к снимку характеристик.
          anyOf:
            - type: object
              required: [aura, closeness]
              properties:
                aura: { type: integer, minimum: -200, maximum: 200 }
                closeness:
                  type: object
                  description: Ключ — simulation.family[].id, значение — фактическое изменение близости.
                  additionalProperties: { type: integer, minimum: -100, maximum: 100 }
            - { type: 'null' }
    SessionSummary:
      type: object
      required: [id, name, age, status, savedAt, provider]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        age: { type: integer, minimum: 0 }
        status: { type: string, enum: [ACTIVE, COMPLETE] }
        savedAt: { type: string, format: date-time }
        provider: { $ref: '#/components/schemas/Provider' }
    EventLink:
      type: object
      required: [sourceId, templateId, domain, phase, month, decisionId, optionId, optionLabel, action, offeredOptions, participantIds, relatedSourceIds]
      properties:
        sourceId: { type: string }
        templateId: { type: string }
        domain: { type: string }
        phase: { type: string, enum: [OFFER, DECISION, OUTCOME, CANCELLED] }
        month: { type: integer, minimum: 0 }
        decisionId: { type: [string, 'null'] }
        optionId: { type: [string, 'null'] }
        optionLabel: { type: [string, 'null'] }
        action: { type: [string, 'null'] }
        offeredOptions:
          type: array
          items: { $ref: '#/components/schemas/HighlightOption' }
        participantIds: { type: array, items: { type: string } }
        relatedSourceIds: { type: array, items: { type: string } }
    HighlightOption:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
    LifeHighlights:
      type: object
      description: Серверная подборка личных решений и подтверждённых последствий. До 12 слайдов в хронологии; не дополняется случайными событиями ради количества.
      required: [modelVersion, status, currency, trackedFromMonth, partialHistory, evaluatedThroughMonth, finalizedAtMonth, decisionCount, candidateCount, slides]
      properties:
        modelVersion: { type: string, const: life-highlights-1 }
        status: { type: string, enum: [LIVE, FINAL], description: LIVE — изменяемая предварительная подборка; FINAL — зафиксирована после завершения жизни. }
        currency: { type: string, const: RUB }
        trackedFromMonth: { type: integer, minimum: 0 }
        partialHistory: { type: boolean, description: true при включении наблюдения в уже начатой жизни. Старые недоказуемые связи не восстанавливаются. }
        evaluatedThroughMonth: { type: integer, minimum: 0 }
        finalizedAtMonth: { type: [integer, 'null'], minimum: 0 }
        decisionCount: { type: integer, minimum: 0, description: Число записанных ответов и покупок, включая не вошедшие в слайды. }
        candidateCount: { type: integer, minimum: 0, description: Число цепочек решений, рассмотренных для подборки. }
        slides:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/HighlightSlide' }
    HighlightSlide:
      type: object
      required: [id, templateId, domain, month, age, title, importance, reasons, decisions, evidence, revisions]
      properties:
        id: { type: string, description: Устойчивый ID цепочки внутри сессии. }
        templateId: { type: string }
        domain: { type: string }
        month: { type: integer, minimum: 0, description: Месяц первого личного выбора в этой цепочке. }
        age: { type: integer, minimum: 0 }
        title: { type: string }
        importance: { type: integer, minimum: 0, maximum: 100, description: Версионированная игровая оценка значимости; не моральная оценка и не вероятность. }
        reasons:
          type: array
          items: { $ref: '#/components/schemas/HighlightReason' }
        decisions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/HighlightDecision' }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/HighlightEvidence' }
        revisions:
          type: array
          items: { $ref: '#/components/schemas/HighlightRevision' }
    HighlightDecision:
      type: object
      required: [id, month, age, title, prompt, optionId, optionLabel, offeredOptions, participantIds, historyEventId, result, statChanges, closenessChanges, balanceChange]
      properties:
        id: { type: string }
        month: { type: integer, minimum: 0 }
        age: { type: integer, minimum: 0 }
        title: { type: string }
        prompt: { type: [string, 'null'], description: Сохранённый текст вопроса, если доступен. null для покупки или старого вопроса без связи. }
        optionId: { type: string }
        optionLabel: { type: string, description: Подпись реально предложенного выбранного варианта, включая показанную цену. }
        participantIds: { type: array, items: { type: string }, description: ID известных участников выбора из simulation.family. }
        offeredOptions:
          type: array
          description: Снимок доступных ответов. Для покупки пустой массив — ассортимент магазина не выдаётся за варианты сюжетного решения.
          items: { $ref: '#/components/schemas/HighlightOption' }
        historyEventId: { type: string }
        result: { type: string, description: Реальный текст результата выбора из летописи. }
        statChanges: { type: object, additionalProperties: { type: integer } }
        closenessChanges: { type: object, additionalProperties: { type: integer } }
        balanceChange: { type: [number, 'null'], description: Изменение доступного денежного баланса при действии, RUB; null если сравнимого снимка бюджета нет. Это не итог всей сюжетной цепочки. }
    HighlightEvidence:
      type: object
      required: [id, month, kind, relation, text, historyEventId]
      properties:
        id: { type: string }
        month: { type: integer, minimum: 0 }
        kind: { type: string, description: Код подтверждённого события или этапа; использовать text для подписи. }
        relation: { type: string, enum: [DIRECT, SAME_STORY, EXPLICIT_DEPENDENCY, TRACKED_ENTITY] }
        text: { type: string }
        historyEventId: { type: [string, 'null'], description: Ссылка на летопись. null для факта, подтверждённого состоянием связанной работы, семьи, обучения и т.п. }
    HighlightReason:
      type: object
      required: [code, points, text]
      properties:
        code: { type: string }
        points: { type: integer, minimum: 0 }
        text: { type: string }
    HighlightRevision:
      type: object
      required: [month, previousScore, score, reasonCodes]
      properties:
        month: { type: integer, minimum: 0 }
        previousScore: { type: integer, minimum: 0, maximum: 100 }
        score: { type: integer, minimum: 0, maximum: 100 }
        reasonCodes: { type: array, items: { type: string } }
    Session:
      type: object
      required: [id, character, version, savedAt, state, provider]
      properties:
        budgetAction:
          description: Результат команды /budget/actions. null при обычном GET и прежних командах; повтор команды возвращает сохранённый исход вместе с актуальной Session.
          anyOf:
            - { $ref: '#/components/schemas/BudgetOutcome' }
            - { type: 'null' }
        id: { type: string, format: uuid }
        character: { $ref: '#/components/schemas/SessionCharacter' }
        version: { type: integer, format: int64, minimum: 1 }
        savedAt: { type: string, format: date-time }
        provider: { $ref: '#/components/schemas/Provider' }
        highlights:
          description: Подборка главных принятых решений. Optional/nullable для прежних завершённых сессий, 1in8b и старого демонстрационного провайдера. Чтение не создаёт подборку.
          anyOf:
            - { $ref: '#/components/schemas/LifeHighlights' }
            - { type: 'null' }
        simulation:
          description: Новая пошаговая локальная жизнь. null у старых local и 1in8b. Клиент выбирает /step по наличию этого блока, не только по provider.
          anyOf:
            - { $ref: '#/components/schemas/LocalSimulation' }
            - { type: 'null' }
        state:
          type: object
          required: [age, status, stats, pendingDecision, history]
          properties:
            age: { type: integer, minimum: 0 }
            status: { type: string, enum: [ACTIVE, COMPLETE] }
            stats: { $ref: '#/components/schemas/Stats' }
            pendingDecision:
              anyOf:
                - { $ref: '#/components/schemas/Decision' }
                - { type: 'null' }
            history:
              type: array
              description: События от старых к новым.
              items: { $ref: '#/components/schemas/HistoryEvent' }
    VersionedAction:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
    CharacterEdit:
      allOf:
        - { $ref: '#/components/schemas/VersionedAction' }
        - type: object
          required: [changes]
          properties:
            changes:
              type: object
              additionalProperties: false
              description: Передайте хотя бы одно новое значение. Пропущенные поля сохраняются.
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                sex:
                  type: string
                  enum: [FEMALE, MALE]
                  description: Только до первого шага. В ответе character.gender содержит русское название, birthFacts.sex — этот код.
                birthYear: { type: integer, minimum: 2023, maximum: 2026, description: Только до первого шага. Статистические показатели сохраняют собственные годы источников. }
                birthplace: { $ref: '#/components/schemas/BirthplaceChanges' }
                family: { $ref: '#/components/schemas/BirthFamilyChanges' }
                stats:
                  type: object
                  additionalProperties: false
                  properties:
                    health: { $ref: '#/components/schemas/Score' }
                    intelligence: { $ref: '#/components/schemas/Score' }
                    appearance: { $ref: '#/components/schemas/Score' }
                    happiness: { $ref: '#/components/schemas/Score' }
                    relationships: { $ref: '#/components/schemas/Score', description: Общий показатель; индивидуальная близость родственников не изменяется автоматически. }
                    aura: { type: integer, minimum: -100, maximum: 100 }
    BirthplaceChanges:
      type: object
      additionalProperties: false
      description: Только для новой локальной жизни до первого шага. Пропуск или null оставляет поле прежним. Пустые region/city очищают поле. Смена страны очищает прежние регион/город, если новые не переданы. Название страны берётся из каталога сервера.
      properties:
        countryCode: { type: string, pattern: '^[A-Z]{2}$', description: ISO 3166-1 alpha-2 одной из 36 поддерживаемых стран. Пример JP; это не countryIso3 из запроса генерации. }
        region: { type: string, maxLength: 100 }
        city: { type: string, maxLength: 100 }
        placeType: { type: string, enum: [URBAN, RURAL] }
    BirthFamilyChanges:
      type: object
      additionalProperties: false
      description: Только до первого шага. Пользовательские значения помечаются source=user-customization и basis=GAME_ASSUMPTION, не выдаются за статистику. Достаток не начисляет деньги и не меняет цены/доход автоматически.
      properties:
        incomeQuintile: { type: integer, minimum: 1, maximum: 5 }
        housing: { type: string, minLength: 1, maxLength: 120 }
        relationships: { type: string, minLength: 1, maxLength: 120, description: Описание атмосферы семьи, отдельно от числовой близости. }
        religion: { type: string, minLength: 1, maxLength: 120 }
        language: { type: string, minLength: 1, maxLength: 120 }
        members:
          type: array
          maxItems: 12
          description: Полный список известных живых родителей/братьев/сестёр при рождении; максимум 2 родителя и 10 братьев/сестёр. Пустой массив убирает всех; пропуск оставляет прежних. Для сохранения ID передать id из simulation.family. Новому родственнику id не передавать. Отсутствующие в массиве прежние родственники удаляются только из ещё не начатой жизни. При замене списка общий relationships становится средней близостью, если stats.relationships не задан явно.
          items: { $ref: '#/components/schemas/BirthFamilyMemberInput' }
    BirthFamilyMemberInput:
      type: object
      additionalProperties: false
      required: [role, name, ageAtBirth]
      properties:
        id: { type: string, minLength: 1, maxLength: 80, description: Только существующий ID этой семьи; повторения запрещены. Без id сервер создаёт новый устойчивый ID. }
        role: { type: string, enum: [mother, father, brother, sister] }
        name: { type: string, minLength: 1, maxLength: 100 }
        ageAtBirth: { type: integer, minimum: 0, maximum: 80, description: Возраст родственника в момент рождения героя. Родители от 18 лет и минимум на 16 лет старше старшего брата/сестры — ограничения игровой модели. }
        occupation: { type: string, maxLength: 100, description: Пропуск сохраняет профессию существующего родственника; пустая строка очищает. Для нового без этого поля — null. }
        closeness: { $ref: '#/components/schemas/Score', description: При пропуске сохраняется прежняя близость, для нового родственника 65. }
        trust: { $ref: '#/components/schemas/Score', description: При пропуске сохраняется прежнее доверие, для нового родственника 60. }
    AnswerDecision:
      allOf:
        - { $ref: '#/components/schemas/VersionedAction' }
        - type: object
          required: [optionId]
          properties:
            optionId: { type: string, minLength: 1, maxLength: 80 }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    BudgetActionRequest:
      type: "object"
      required: ["expectedVersion","action","optionId"]
      properties:
        expectedVersion: {"type":"integer","format":"int64","minimum":1}
        action:
          type: "string"
          enum:
            - "APPLY_JOB"
            - "REQUEST_RAISE"
            - "QUIT_JOB"
            - "TAKE_SIDE_JOB"
            - "QUIT_SIDE_JOB"
            - "OPEN_BUSINESS"
            - "SET_STRATEGY"
            - "SELL_ASSET"
        optionId: {"type":"string","minLength":1,"maxLength":100}
    BudgetOutcome:
      type: "object"
      description: "Результат именно команды; хранится с ключом запроса. DECLINED не меняет Session/version/savedAt. Повтор возвращает прежний исход и актуальную Session."
      required: ["status","code","message","month","currency","periodMonths","amounts"]
      properties:
        status: {"type":"string","enum":["APPLIED","DECLINED"]}
        code: {"type":"string"}
        message: {"type":"string"}
        month: {"type":"integer"}
        currency: {"const":"RUB"}
        periodMonths: {"type":["integer","null"]}
        amounts: {"type":"object","additionalProperties":{"type":"number"}}
    BudgetLine:
      type: "object"
      required: ["id","title","amount"]
      properties: {"id":{"type":"string"},"title":{"type":"string"},"amount":{"type":"number"}}
    BudgetEmployment:
      type: "object"
      description: "basePay — договорная месячная ставка; expectedPay — прогноз с текущей работоспособностью, actualIncome — проведённые поступления этой занятости за 12 месяцев. null при недостоверной детализации старых записей или BUSINESS; бизнес показан отдельно. Неизвестные часы старой работы — null."
      required:
        - "id"
        - "title"
        - "status"
        - "basePay"
        - "periodMonths"
        - "hoursPerWeek"
        - "schedule"
        - "currentTenureMonths"
        - "totalExperienceMonths"
        - "workCapacityPercent"
        - "expectedPay"
        - "actualIncome"
        - "actualPeriodMonths"
      properties:
        id: {"type":"string"}
        title: {"type":"string"}
        status: {"type":"string"}
        basePay: {"type":"number"}
        periodMonths: {"const":1}
        hoursPerWeek: {"type":["integer","null"]}
        schedule: {"type":["string","null"]}
        currentTenureMonths: {"type":"integer"}
        totalExperienceMonths: {"type":"integer"}
        workCapacityPercent: {"type":"integer"}
        expectedPay: {"type":["number","null"]}
        actualIncome: {"type":["number","null"]}
        actualPeriodMonths: {"const":12}
    BudgetBusinessResult:
      type: "object"
      description: "Фактический результат текущего дела за 12 месяцев. Старый чистый доход не раскладывается на выручку и расходы."
      required: ["id","title","revenue","costs","net","grossBreakdownKnown"]
      properties:
        id: {"type":"string"}
        title: {"type":"string"}
        revenue: {"type":["number","null"]}
        costs: {"type":["number","null"]}
        net: {"type":["number","null"]}
        grossBreakdownKnown: {"type":"boolean"}
    BudgetStorage:
      type: "object"
      description: "amount — положительная часть единого денежного остатка. actualReturn — фактические проценты за 12 месяцев; выбор стратегии не перемещает деньги."
      required: ["selectedId","amount","actualReturn","basis"]
      properties:
        selectedId: {"type":"string"}
        amount: {"type":"number"}
        actualReturn: {"type":"number"}
        basis: {"type":"string"}
    BudgetIncome:
      type: "object"
      required: ["total","monthlyAverage","sources","primary","secondary","business","storage"]
      properties:
        total: {"type":"number"}
        monthlyAverage: {"type":"number"}
        sources: {"type":"array","items":{"$ref":"#/components/schemas/BudgetLine"}}
        primary: {"anyOf":[{"$ref":"#/components/schemas/BudgetEmployment"},{"type":"null"}]}
        secondary: {"anyOf":[{"$ref":"#/components/schemas/BudgetEmployment"},{"type":"null"}]}
        business: {"anyOf":[{"$ref":"#/components/schemas/BudgetBusinessResult"},{"type":"null"}]}
        storage: {"$ref":"#/components/schemas/BudgetStorage"}
    BudgetForecast:
      type: "object"
      description: "Прогноз без изменения сохранения. requiredPayments включает плановый основной долг, в том числе непокрытую часть. projectedBalance = balance + expectedIncome − requiredPayments; deficit = max(0, -projectedBalance)."
      required: ["months","balance","available","expectedIncome","requiredPayments","projectedBalance","deficit","assumption"]
      properties:
        months: {"const":2}
        balance: {"type":"number"}
        available: {"type":"number"}
        expectedIncome: {"type":"number"}
        requiredPayments: {"type":"number"}
        projectedBalance: {"type":"number"}
        deficit: {"type":"number"}
        assumption: {"type":"string"}
    BudgetObligation:
      type: "object"
      description: "Срок null: погашение зависит от средств. assetId — устойчивый ID обеспечения, null если связь неизвестна."
      required:
        - "id"
        - "title"
        - "type"
        - "principal"
        - "annualBasisPoints"
        - "nextMonthlyInterest"
        - "plannedPrincipalPayment"
        - "scheduledMonthsRemaining"
        - "assetId"
      properties:
        id: {"type":"string"}
        title: {"type":"string"}
        type: {"type":"string"}
        principal: {"type":"number"}
        annualBasisPoints: {"type":"integer"}
        nextMonthlyInterest: {"type":"number"}
        plannedPrincipalPayment: {"type":"number"}
        scheduledMonthsRemaining: {"type":["integer","null"]}
        assetId: {"type":["string","null"]}
    BudgetExpenses:
      type: "object"
      required: ["total","monthlyAverage","categories","obligations","forecast"]
      properties:
        total: {"type":"number"}
        monthlyAverage: {"type":"number"}
        categories: {"type":"array","items":{"$ref":"#/components/schemas/BudgetLine"}}
        obligations: {"type":"array","items":{"$ref":"#/components/schemas/BudgetObligation"}}
        forecast: {"$ref":"#/components/schemas/BudgetForecast"}
    BudgetJobOffer:
      type: "object"
      required:
        - "id"
        - "title"
        - "basePay"
        - "periodMonths"
        - "hoursPerWeek"
        - "schedule"
        - "education"
        - "minQualification"
        - "minExperienceMonths"
        - "noExperience"
        - "experienceMatch"
        - "available"
        - "reason"
      properties:
        id: {"type":"string"}
        title: {"type":"string"}
        basePay: {"type":"number"}
        periodMonths: {"const":1}
        hoursPerWeek: {"type":"integer"}
        schedule: {"type":"string"}
        education: {"type":"string"}
        minQualification: {"type":"integer"}
        minExperienceMonths: {"type":"integer"}
        noExperience: {"type":"boolean"}
        experienceMatch: {"type":"boolean"}
        available: {"type":"boolean"}
        reason: {"type":["string","null"]}
    BudgetRaiseOffer:
      type: "object"
      required: ["id","currentPay","proposedPay","extraHours","guaranteed","available","reason"]
      properties:
        id: {"type":"string","enum":["results","tenure","responsibility"]}
        currentPay: {"type":"number"}
        proposedPay: {"type":"number"}
        extraHours: {"type":"integer"}
        guaranteed: {"const":false}
        available: {"type":"boolean"}
        reason: {"type":["string","null"]}
    BudgetJobs:
      type: "object"
      description: "Основные вакансии или подработки. experienceMatch — фильтр опыта, available дополнительно учитывает образование, здоровье, возраст, нагрузку и pendingDecision."
      required: ["offers","raiseGrounds","current","canQuit","quitReason"]
      properties:
        offers: {"type":"array","items":{"$ref":"#/components/schemas/BudgetJobOffer"}}
        raiseGrounds: {"type":"array","items":{"$ref":"#/components/schemas/BudgetRaiseOffer"}}
        current: {"anyOf":[{"$ref":"#/components/schemas/BudgetEmployment"},{"type":"null"}]}
        canQuit: {"type":"boolean"}
        quitReason: {"type":["string","null"]}
    BudgetBusinessOffer:
      type: "object"
      description: "risk — игровой индекс, не процент вероятности банкротства. currentNetTarget — стартовая цель чистого месячного результата при полной работоспособности."
      required: ["id","title","investment","currentNetTarget","periodMonths","risk","expectation","available","reason"]
      properties:
        id: {"type":"string"}
        title: {"type":"string"}
        investment: {"type":"number"}
        currentNetTarget: {"type":"number"}
        periodMonths: {"const":1}
        risk: {"type":"integer","minimum":0,"maximum":100}
        expectation: {"type":"string"}
        available: {"type":"boolean"}
        reason: {"type":["string","null"]}
    BudgetBusinesses:
      type: "object"
      required: ["offers","current","compatibility"]
      properties:
        offers: {"type":"array","items":{"$ref":"#/components/schemas/BudgetBusinessOffer"}}
        current: {"anyOf":[{"$ref":"#/components/schemas/BudgetBusinessResult"},{"type":"null"}]}
        compatibility: {"type":"string"}
    BudgetStrategyOffer:
      type: "object"
      required: ["id","title","description","risk","available","reason","annualBasisPoints"]
      properties:
        id: {"type":"string","enum":["cash","deposit","bonds","balanced-fund","equity-fund","world-index","trading"]}
        title: {"type":"string"}
        description: {"type":"string"}
        risk: {"type":"string"}
        available: {"type":"boolean"}
        reason: {"type":["string","null"]}
        annualBasisPoints: {"type":["integer","null"]}
    BudgetStrategies:
      type: "object"
      required: ["selectedId","options","current"]
      properties:
        selectedId: {"type":"string"}
        options: {"type":"array","items":{"$ref":"#/components/schemas/BudgetStrategyOffer"}}
        current: {"$ref":"#/components/schemas/BudgetStorage"}
    BudgetAsset:
      type: "object"
      required: ["id","title","kind","ownershipPercent","salePrice","debtIds","available","reason"]
      properties:
        id: {"type":"string"}
        title: {"type":"string"}
        kind: {"type":"string"}
        ownershipPercent: {"type":"integer"}
        salePrice: {"type":"number"}
        debtIds: {"type":"array","items":{"type":"string"}}
        available: {"type":"boolean"}
        reason: {"type":["string","null"]}
    BudgetSaleRecord:
      type: "object"
      required: ["assetId","title","month","proceeds","debtRepaid","net"]
      properties:
        assetId: {"type":"string"}
        title: {"type":"string"}
        month: {"type":"integer"}
        proceeds: {"type":"number"}
        debtRepaid: {"type":"number"}
        net: {"type":"number"}
    BudgetAssets:
      type: "object"
      required: ["assets","sales"]
      properties:
        assets: {"type":"array","items":{"$ref":"#/components/schemas/BudgetAsset"}}
        sales: {"type":"array","items":{"$ref":"#/components/schemas/BudgetSaleRecord"}}
    BudgetSalePreview:
      type: "object"
      description: "Использовать version обёртки как expectedVersion продажи. net = salePrice − debtPayoff, может быть отрицательным при доплате. Аренда пока не моделируется: rentalModelled=false и rentalIncomeStopped=null."
      required:
        - "assetId"
        - "title"
        - "salePrice"
        - "debtPayoff"
        - "net"
        - "balanceAfterSale"
        - "obligationIds"
        - "yearlyUpkeepStopped"
        - "rentalIncomeStopped"
        - "rentalModelled"
        - "forecast"
        - "available"
        - "reason"
        - "priceRule"
      properties:
        assetId: {"type":"string"}
        title: {"type":"string"}
        salePrice: {"type":"number"}
        debtPayoff: {"type":"number"}
        net: {"type":"number"}
        balanceAfterSale: {"type":"number"}
        obligationIds: {"type":"array","items":{"type":"string"}}
        yearlyUpkeepStopped: {"type":"number"}
        rentalIncomeStopped: {"type":["number","null"]}
        rentalModelled: {"type":"boolean"}
        forecast: {"anyOf":[{"$ref":"#/components/schemas/BudgetForecast"},{"type":"null"}]}
        available: {"type":"boolean"}
        reason: {"type":["string","null"]}
        priceRule: {"type":"string"}
    BudgetIncomePage:
      type: "object"
      description: "Денежные суммы — основные единицы игровых RUB. Период фактических итогов — 12 месяцев, месячные ставки явно имеют periodMonths=1. Для 1in8b и старого демо available=false, data/currency/periodMonths=null."
      required: ["version","currency","periodMonths","available","reason","data"]
      properties:
