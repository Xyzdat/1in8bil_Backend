spring.application.name=life-backend

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/life_db
spring.datasource.username=life_app
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

life.engine.onein8b.api-key=${LIFE_1IN8B_API_KEY:${API_KEY:}}
life.engine.onein8b.token-secret=${LIFE_1IN8B_TOKEN_SECRET:}
